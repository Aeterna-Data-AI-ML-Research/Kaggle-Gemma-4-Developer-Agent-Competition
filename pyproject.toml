[project]
name = "gemma4-swe-agent-study"
version = "0.1.0"
description = "Evidence-first study of a Gemma 4 code-repair agent: compact trajectories, benchmark splits, and reproducible tables."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.scripts]
reproduce-all-tables = "scripts.reproduce_all_tables:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
